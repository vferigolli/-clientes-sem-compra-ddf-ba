<script>
(()=>{
const DATA=window.APP_DATA, USERS=window.APP_USERS, app=document.getElementById('app'), portal=document.getElementById('portal');
const PAGE_SIZE=35; const bucketOrder=['30D','60D','90D','120D','150D+'];

const d=defaults();
const state={session:readSession(),search:'',bucket:'TODOS',coordinator:'TODOS',seller:'TODOS',city:'TODAS',ratings:d.ratings,statuses:d.statuses,sort:'potencial-desc',shown:PAGE_SIZE};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function sha256Fallback(ascii){function rightRotate(value,amount){return(value>>>amount)|(value<<(32-amount))}let mathPow=Math.pow,maxWord=mathPow(2,32),lengthProperty='length',i,j,result='',words=[],asciiBitLength=ascii[lengthProperty]*8,hash=sha256Fallback.h=sha256Fallback.h||[],k=sha256Fallback.k=sha256Fallback.k||[],primeCounter=k[lengthProperty],isComposite={};for(let candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(i=0;i<313;i+=candidate)isComposite[i]=candidate;hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0}}ascii+='\x80';while(ascii[lengthProperty]%64-56)ascii+='\x00';for(i=0;i<ascii[lengthProperty];i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);words[words[lengthProperty]]=asciiBitLength;for(j=0;j<words[lengthProperty];){let w=words.slice(j,j+=16),oldHash=hash.slice(0);hash=hash.slice(0,8);for(i=0;i<64;i++){let i2=i+j,w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0),temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;hash.pop()}for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){let b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}return result}async function hash(value){if(globalThis.crypto&&crypto.subtle){const bytes=new TextEncoder().encode(value);const out=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(out)].map(x=>x.toString(16).padStart(2,'0')).join('')}return sha256Fallback(unescape(encodeURIComponent(value)))}
function reset(){const x=defaults();Object.assign(state,{search:'',bucket:'TODOS',coordinator:'TODOS',seller:'TODOS',city:'TODAS',ratings:x.ratings,statuses:x.statuses,sort:'potencial-desc',shown:PAGE_SIZE})}

function filtered(ignoreBucket=false){const q=norm(state.search);let arr=roleScope().filter(c=>{if(!ignoreBucket&&state.bucket!=='TODOS'&&c.classificacao!==state.bucket)return false;if(state.session.role==='gerente'&&state.coordinator!=='TODOS'&&c.coordenador!==state.coordinator)return false;if(state.session.role!=='vendedor'&&state.seller!=='TODOS'&&c.vendedor!==state.seller)return false;if(state.city!=='TODAS'&&c.cidade!==state.city)return false;if(!state.ratings.has(c.rating))return false;if(!state.statuses.has(c.status||''))return false;if(q&&!norm([c.razaoSocial,c.codigo,c.cidade,c.vendedor,c.coordenador].join(' ')).includes(q))return false;return true});
 const rank=x=>bucketOrder.indexOf(x.classificacao);const coll=(a,b)=>a.localeCompare(b,'pt-BR');
 arr.sort((a,b)=>state.sort==='potencial-asc'?a.potencial-b.potencial:state.sort==='tempo-asc'?rank(a)-rank(b)||b.potencial-a.potencial:state.sort==='tempo-desc'?rank(b)-rank(a)||b.potencial-a.potencial:state.sort==='nome'?coll(a.razaoSocial,b.razaoSocial):state.sort==='cidade'?coll(a.cidade||'',b.cidade||''):b.potencial-a.potencial);return arr}
function summary(arr){return{count:arr.length,potential:arr.reduce((s,c)=>s+(c.potencial||0),0)}}

function renderLogin(){app.innerHTML=`<main class="login-shell"><section class="login-card"><div class="login-brand"><div class="brand-mark">DDF</div><div class="login-title"><h1>Clientes sem compra</h1><p>Acesse sua carteira de clientes e o potencial de recuperação.</p></div></div><form id="login-form"><div class="field"><label for="login">Login</label><input class="input" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome.sobrenome"></div><div class="field"><label for="password">Senha</label><div class="input-wrap"><input class="input password-input" id="password" name="password" type="password" autocomplete="current-password"><button class="eye-btn" id="eye" type="button" aria-label="Mostrar senha">◉</button></div></div><div class="login-error" id="login-error" role="alert"></div><button class="primary-btn" type="submit">Entrar</button></form></section></main>`;
 const form=document.getElementById('login-form'),pw=document.getElementById('password'),eye=document.getElementById('eye');eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.setAttribute('aria-label',pw.type==='password'?'Mostrar senha':'Ocultar senha')};

function renderDashboard(){if(!state.session){renderLogin();return}const arr=filtered(),tot=summary(arr),base=filtered(true),baseBy={};bucketOrder.forEach(k=>baseBy[k]=summary(base.filter(c=>c.classificacao===k)));const sellerList=sellers(),cityList=cities();

 const row=v=>`<label class="option-row"><input type="checkbox" value="${esc(v)}" ${current.has(v)?'checked':''}><span>${esc(isRating?v:statusName(v))}</span></label>`;
 portal.innerHTML=`<div class="overlay" id="multi-overlay"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div class="sheet-head"><h2>${title}</h2><button class="icon-btn" id="multi-close" aria-label="Fechar">×</button></div><div class="sheet-actions"><button class="chip-btn" data-action="all">Todos</button><button class="chip-btn" data-action="standard">Padrão</button><button class="chip-btn" data-action="clear">Limpar</button></div><div class="options">${values.map(row).join('')}</div><div class="sheet-footer"><button class="secondary" id="multi-cancel">Cancelar</button><button class="apply" id="multi-apply">Aplicar</button></div></section></div>`;
 const close=()=>portal.innerHTML='';document.getElementById('multi-close').onclick=close;document.getElementById('multi-cancel').onclick=close;document.getElementById('multi-overlay').onclick=e=>{if(e.target.id==='multi-overlay')close()};
 const checks=()=>[...portal.querySelectorAll('input[type=checkbox]')];portal.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;checks().forEach(ch=>ch.checked=a==='all'?true:a==='clear'?false:standard.has(ch.value))});document.getElementById('multi-apply').onclick=()=>{const chosen=new Set(checks().filter(x=>x.checked).map(x=>x.value));if(isRating)state.ratings=chosen;else state.statuses=chosen;state.shown=PAGE_SIZE;close();renderDashboard()};
}
function openClient(code){const c=roleScope().find(x=>x.codigo===code);if(!c)return;const [dark,soft]=theme[c.classificacao];portal.innerHTML=`<div class="overlay" id="detail-overlay"><section class="detail-sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div class="detail-head"><div><span class="badge" style="--bucket-dark:${dark};--bucket-soft:${soft}">${esc(c.classificacao)}</span><h2>${esc(c.razaoSocial)}</h2><p>Código ${esc(c.codigo)}</p></div><button class="icon-btn" id="detail-close" aria-label="Fechar">×</button></div><div class="quick-grid"><div class="quick"><span>Potencial mensal</span><strong>${money(c.potencial)}</strong></div><div class="quick"><span>Rating</span><strong>${esc(c.rating||'—')}</strong></div><div class="quick"><span>Status</span><strong>${esc(shortStatus(c.status))}</strong></div></div><div class="info-grid"><div class="info"><span>Vendedor</span><strong>${esc(displaySeller(c.vendedor))}</strong></div><div class="info"><span>Coordenador</span><strong>${esc(c.coordenador)}</strong></div><div class="info"><span>Cidade</span><strong>${esc(c.cidade||'Não informada')}</strong></div><div class="info"><span>Bairro</span><strong>${esc(c.bairro||'Não informado')}</strong></div><div class="info wide"><span>Endereço</span><strong>${esc(c.endereco||'Não informado')}</strong></div><div class="info wide"><span>Status completo do cliente</span><strong>${esc(statusName(c.status))}</strong></div></div></section></div>`;const close=()=>portal.innerHTML='';document.getElementById('detail-close').onclick=close;document.getElementById('detail-overlay').onclick=e=>{if(e.target.id==='detail-overlay')close()}}
function shortStatus(v){if(!v)return'Sem status';if(v==='CLIENTE OK')return'OK';if(v==='CLIENTE LIVRE')return'Livre';if(v==='CLIENTE EM OBSERVAÇÃO')return'Observação';return'Consultar abaixo'}
state.session?renderDashboard():renderLogin();
})();
</script>
</body></html>
